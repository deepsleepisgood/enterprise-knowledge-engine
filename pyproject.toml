[project]
name = "ps07-knowledge-engine"
version = "0.1.0"
description = "Temporal authority-graph knowledge engine (PS-07)"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "alembic>=1.13",
  "pgvector>=0.3",
  "python-docx>=1.1",
  "python-pptx>=1.0",
  "pymupdf>=1.24",
  "beautifulsoup4>=4.12",
  "fastembed>=0.4",
  "python-magic>=0.4; sys_platform != 'win32'",
  "python-magic-bin>=0.4; sys_platform == 'win32'",
  "pandas>=2.2",
  "openpyxl>=3.1",
  "pyyaml>=6.0",
  "anthropic>=0.70",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pgserver>=0.1.4", "httpx>=0.27"]

[tool.setuptools.packages.find]
# Flat layout with many top-level folders: name the Python packages explicitly.
include = ["app*", "plugins*", "evaluation*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["web", ".pgdata", "migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency markers are evaluated once by design.
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Query", "fastapi.Header"]

[tool.ruff.lint.per-file-ignores]
# Prompt text is part of the LLM cache key: do not reflow it for line length.
"app/graph/extract.py" = ["E501"]
"app/graph/induce.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not live_llm'"  # live tests: pytest -m live_llm
markers = [
  "db: needs a Postgres database (DATABASE_URL or the embedded dev server)",
  "live_llm: calls the configured LLM provider (needs its API key); run with -m live_llm",
]
