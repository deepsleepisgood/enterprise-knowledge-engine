[project]
name = "ps07-knowledge-engine"
version = "0.1.0"
description = "Temporal authority-graph knowledge engine (PS-07)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "alembic>=1.13",
  "pgvector>=0.3",
  "python-docx>=1.1",
  "pandas>=2.2",
  "openpyxl>=3.1",
  "pyyaml>=6.0",
  "anthropic>=0.70",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pgserver>=0.1.4"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["web", ".pgdata", "migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "db: needs a Postgres database (DATABASE_URL or the embedded dev server)",
  "live_llm: calls the real Anthropic API (needs ANTHROPIC_API_KEY)",
]
