services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ps07
      POSTGRES_PASSWORD: ps07
      POSTGRES_DB: ps07
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ps07"]
      interval: 2s
      retries: 30

volumes:
  pgdata:
